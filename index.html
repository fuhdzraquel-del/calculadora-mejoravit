<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Mejoravit Solo para Ti</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #003366; font-size: 26px; margin-bottom: 20px; }
    
    /* Caja de Infografía */
    #infografia { background: #ffffff; border: 2px solid #003366; border-radius: 10px; padding: 20px; margin-top: 15px; }
    .infografia-header { text-align: center; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-bottom: 15px; }
    .infografia-title { font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
    .monto-destacado { font-size: 32px; color: #003366; font-weight: bold; margin: 5px 0; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #555; }
    .detail-value { font-weight: bold; color: #111; }
    
    /* Botón de descarga */
    .action-buttons { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
    .btn-download { background-color: #28a745; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; transition: background 0.2s; }
    .btn-download:hover { background-color: #218838; }
  </style>

  <!-- Librería externa para convertir HTML a Imagen en el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="container">
  <!-- Tu formulario actual va aquí -->

  <!-- INFOGRAFIA RESUMEN A DESCARGAR -->
  <div id="infografia">
    <div class="infografia-header">
      <div class="infografia-title">Monto de Crédito Estimado</div>
      <div class="monto-destacado" id="resMonto">$37,472.92 MXN</div>
    </div>
    <div class="detail-row">
      <span class="detail-label">Saldo Subcuenta de Vivienda (Ajustado):</span>
      <span class="detail-value" id="resSubcuenta">$41,636.58</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Retención de Nómina Mensual:</span>
      <span class="detail-value" id="resRetencion">$796.19</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Aportación Patronal Mensual (5%):</span>
      <span class="detail-value" id="resAportacion">$630.98</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Tasa de Interés Anual:</span>
      <span class="detail-value">10.00%</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Plazo Contratado:</span>
      <span class="detail-value">5 años</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Tiempo de Pago Real Estimado:</span>
      <span class="detail-value" style="color: #003366;">2 año(s) y 6 mes(es) (30 meses)</span>
    </div>
  </div>

  <!-- Botón para descargar -->
  <div class="action-buttons">
    <button class="btn-download" onclick="descargarInfografia()">
      📥 Descargar Infografía (Imagen PNG)
    </button>
  </div>
</div>

<script>
  function descargarInfografia() {
    const contenedor = document.getElementById('infografia');
    
    // Generar captura de imagen PNG de alta calidad
    html2canvas(contenedor, { scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'Resumen_Mejoravit_Cliente.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }
</script>

</body>
</html>
